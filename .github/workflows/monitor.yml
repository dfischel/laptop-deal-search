name: Laptop deal monitor

on:
  schedule:
    # Times are UTC (5 hours ahead of US Eastern, 8 ahead of Pacific).
    # Every 3 hours, all season:
    - cron: "7 */3 * * *"
    # Plus hourly over Black Friday / Cyber Monday, Nov 20 - Dec 5:
    - cron: "37 * 20-30 11 *"
    - cron: "37 * 1-5 12 *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Also send a test alert (to check that emails arrive)"
        type: boolean
        default: false

permissions:
  contents: write   # commit state.json (which deals you've already been alerted about)
  issues: write     # open alert issues
  actions: write    # switch this workflow off after the return deadline

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for deals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m monitor ${{ inputs.test_alert && '--test-alert' || '' }}

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then echo "No state change"; exit 0; fi
          git commit -m "Update monitor state"
          git pull --rebase
          git push
